# Phishing & Typosquats -- the source of truth for filter/phishing.sieve.
# Run `python tools/generate.py` after editing.
#
# Every entry here is a lookalike domain, not a real sender. They are
# aggregated from the `kind: block` records of the other categories, so a
# free-plan user (one active filter) can install this one on its own.
#
# Entries came from the project's original reference lists and are NOT
# individually verified -- check one before trusting it.

id: phishing
title: Phishing & Typosquats
description: Lookalike domains that impersonate services the other filters handle.
install_order: 22
languages:
- en
- vi
- zh
- ja
folder: Phishing
shape: flat
whitelist:
- :addrbook:personal
