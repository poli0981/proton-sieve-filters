# Proton Service Notifications -- generated by tools/migrate.py, then maintained by hand.
# This file is the source of truth; filter/proton.sieve is generated from it.

id: proton
title: Proton Service Notifications
description: Mail from Proton's own services.
install_order: 2
folder: Proton
shape: nested
whitelist:
- :addrbook:personal
spam_discard: false
domains:
- match: billing@proton.me
  kind: sender
  scope: exact
  source: md
- match: community@proton.me
  kind: sender
  scope: exact
  source: md
- match: feedback@proton.me
  kind: sender
  scope: exact
  source: md
- match: newsletter@proton.me
  kind: sender
  scope: exact
  source: md
- match: no-reply@proton.me
  kind: sender
  scope: exact
  source: md
- match: noreply@proton.me
  kind: sender
  scope: exact
  source: md
- match: notifications@proton.me
  kind: sender
  scope: exact
  source: md
- match: pm.me
  kind: allow
  scope: subdomains
  note: Short domain for Proton Mail
  source: md+sieve
- match: pr0ton.me
  kind: block
  scope: exact
  note: Zero instead of 'o'
  source: md
- match: proton-mail.com
  kind: block
  scope: exact
  note: Missing 'mail' in official domain
  source: md
- match: proton.ch
  kind: allow
  scope: subdomains
  note: Switzerland-based domain
  source: md+sieve
- match: proton.com
  kind: block
  scope: exact
  note: Missing '.me' extension
  source: md
- match: proton.me
  kind: allow
  scope: subdomains
  note: Primary Proton domain
  source: md+sieve
- match: protoncalendar.com
  kind: allow
  scope: subdomains
  note: Proton Calendar service
  source: md+sieve
- match: protondrive.com
  kind: allow
  scope: subdomains
  note: Proton Drive service
  source: md+sieve
- match: protonmai1.com
  kind: block
  scope: exact
  note: Number '1' instead of 'l'
  source: md
- match: protonmail.ch
  kind: allow
  scope: subdomains
  note: Legacy Swiss domain
  source: md+sieve
- match: protonmail.com
  kind: allow
  scope: subdomains
  note: Legacy ProtonMail domain
  source: md+sieve
- match: protonstatus.com
  kind: allow
  scope: subdomains
  note: Service status and uptime monitoring
  source: md+sieve
- match: protonvpn.com
  kind: allow
  scope: subdomains
  note: Proton VPN service
  source: md+sieve
- match: security@proton.me
  kind: sender
  scope: exact
  source: md
- match: support@proton.me
  kind: sender
  scope: exact
  source: md
- match: survey@proton.me
  kind: sender
  scope: exact
  source: md
- match: updates@proton.me
  kind: sender
  scope: exact
  source: md
keyword_groups:
- group: 1. Critical Security Alerts (90 days retention)
  en:
  - Security Alert
  - Account Compromised
  - Unauthorized Access
  - Login Alert
  - Security Breach
  - Account Locked
  - Suspicious Activity
  - Password Changed
  - Two-Factor Authentication
  - Device Authorization
  - Login from New Location
  - Security Warning
- group: 2. Billing & Subscription (365 days retention)
  en:
  - Subscription Confirmation
  - Billing Update
  - Payment Received
  - Renewal Notice
  - Invoice Attached
  - Account Charged
  - Plan Upgrade
