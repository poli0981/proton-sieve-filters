name: Notify CI Failures

on:
  workflow_run:
    # A glob is not a supported matcher here -- workflow_run matches on literal
    # workflow names, so ["*"] never fired. Until v0.2.1 there was also no CI
    # workflow for it to watch.
    workflows: ["CI"]
    types: [completed]

# REQUIRED: declare permissions matching the reusable workflow's needs.
# Reusable needs `actions: read` to inspect workflow_run details.
permissions:
  contents: read
  actions: read

jobs:
  notify:
    uses: poli0981/.github/.github/workflows/notify-ci-failure.yml@main
    secrets: inherit