# The project is in maintenance mode (MAINTENANCE.md). Every issue goes through a form,
# so each one arrives labelled with the case it falls under. Issues opened another way
# are checked by .github/workflows/maintenance-triage.yml.
blank_issues_enabled: false
contact_links:
  - name: Feature request or new filter — not accepted
    url: https://github.com/poli0981/proton-sieve-filters/blob/main/MAINTENANCE.md
    about: >-
      The project is in maintenance mode and is not taking new features, filters,
      categories or keywords. Fork it instead — the data is CC0 and the code MIT.
  - name: Security or phishing-list problem
    url: https://github.com/poli0981/proton-sieve-filters/security/advisories/new
    about: Report privately. See SECURITY.md for what counts.
  - name: Problem with Proton Mail itself
    url: https://proton.me/support
    about: >-
      This project is not affiliated with Proton AG. For the mail service, its
      apps, or your account, contact Proton.
  - name: Question
    url: https://github.com/poli0981/proton-sieve-filters/blob/main/docs/FAQ.md
    about: Check the FAQ and Troubleshooting first.
